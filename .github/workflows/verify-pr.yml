name: Verify PR

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate contributor files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run validator
        run: node scripts/validate.js
